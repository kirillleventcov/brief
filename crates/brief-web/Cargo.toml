[package]
name    = "brief-web"
version.workspace = true
edition.workspace = true
description = "Static-site generator for Brief documents (analogous to mdBook)."

[dependencies]
brief-core            = { path = "../brief-core", default-features = false }
mimalloc              = "0.1"
clap                  = { version = "4", features = ["derive"] }
serde                 = { version = "1", features = ["derive"] }
toml                  = "0.8"
notify                = "8"

[dev-dependencies]
tempfile = "3"

[lib]
name = "brief_web"
path = "src/lib.rs"

[[bin]]
name = "brief-web"
path = "src/main.rs"
