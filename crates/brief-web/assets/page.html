<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title_full }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="stylesheet" href="{{ stylesheet }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ base_url }}">{{ site_title }}</a>
    <button id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
  </header>
  <div class="layout">
    <aside class="sidebar">{{ sidebar }}</aside>
    <main class="content">
      <article class="prose">
        {{ content }}
      </article>
      <footer class="page-footer">
        <p>Rendered by <code>brief-web</code>.</p>
      </footer>
    </main>
  </div>
  {{ reload_script }}
  <script>
    (function () {
      var key = "brief-web-theme";
      var btn = document.getElementById("theme-toggle");
      var saved = localStorage.getItem(key);
      if (saved) document.documentElement.dataset.theme = saved;
      if (btn) btn.addEventListener("click", function () {
        var cur = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = cur;
        localStorage.setItem(key, cur);
      });
    }());
  </script>
</body>
</html>
