[package]
name = "brief-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Keep the fuzz crate out of the parent workspace (cargo-fuzz standard).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

# The package was renamed to `brief-core` for crates.io; its lib target is
# still named `brief`, which is the name the fuzz targets import.
[dependencies.brief-core]
path = ".."
default-features = false

[[bin]]
name = "parse_full"
path = "fuzz_targets/parse_full.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_inline"
path = "fuzz_targets/parse_inline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_args"
path = "fuzz_targets/parse_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "convert_md"
path = "fuzz_targets/convert_md.rs"
test = false
doc = false
bench = false
