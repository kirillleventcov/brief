[package]
name              = "brief-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description       = "Compiler library for the Brief markup language: lexer, parser, AST, HTML/LLM emitters, formatter, and Markdown-to-Brief converter."
homepage          = "https://docs.brief.kirillleventcov.com"
documentation     = "https://docs.rs/brief-core"
readme            = "README.md"
keywords          = ["markup", "markdown", "compiler", "llm", "brief"]
categories        = ["text-processing", "compilers", "parsing"]

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml       = "0.8.23"
pulldown-cmark = { version = "0.13", default-features = false }
notify = "8"
notify-debouncer-mini = { version = "0.7", default-features = false }

[dev-dependencies]
tempfile = "3"

[lib]
name = "brief"
path = "src/lib.rs"
