[package]
name = "brief"
version = "0.1.1"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }

[lib]
name = "brief"
path = "src/lib.rs"

[[bin]]
name = "brief"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
